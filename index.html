*,*::before,*::after{box-sizing:border-box}

header img{width:96px;height:96px;cursor:pointer;border-radius:50%;object-fit:cover;border:3px solid #fff;flex:0 0 auto}

.slot{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 0;font:inherit;font-weight:600;font-size:.95rem;cursor:pointer}
.slot[disabled]{background:var(--taken);color:var(--takenInk);cursor:not-allowed}
.slot.taken{background:var(--taken);color:var(--takenInk);text-decoration:line-through}
.slot.mine{background:color-mix(in srgb,var(--ok) 20%,var(--surface));color:var(--ok);border-color:var(--ok);text-decoration:none}

/* ===== الثيم: زخرفة الكاشي البغدادي ===== */
:root{
  --lapis:#14306B;--lapis2:#0C1F4A;--turq:#1597A0;--gold:#E2A82B;--rose:#C2364B;
  --bg:#EDF5F5;--surface:#FFFFFF;--ink:#13213F;--muted:#55627E;--line:#D3E2E4;--soft:#E3EFF0;
  --ok:#17845A;--red:var(--rose);--navy:var(--lapis);
  --accent:var(--turq);--accentInk:#fff;--glow:rgba(21,151,160,.28);
}
body[data-role="owner"]{--accent:#C98A12;--glow:rgba(226,168,43,.32)}
body[data-role="admin"]{--accent:var(--rose);--glow:rgba(194,54,75,.28)}

body{background:var(--bg);
  background-image:radial-gradient(circle at 1px 1px,color-mix(in srgb,var(--accent) 22%,transparent) 1px,transparent 0);
  background-size:22px 22px}

/* شريط الكاشي فوق */
.pole{height:14px;background:
  conic-gradient(from 45deg at 50% 50%,var(--gold) 0 25%,var(--turq) 0 50%,var(--gold) 0 75%,var(--turq) 0) 0 0/14px 14px,var(--lapis)}

.waves{position:absolute;left:0;right:0;bottom:-1px;height:52px;z-index:0;pointer-events:none}

.day{border-radius:16px;border-width:1.5px;min-width:76px;transition:transform .15s}
.day[aria-pressed="true"]{background:linear-gradient(160deg,var(--lapis),color-mix(in srgb,var(--accent) 70%,var(--lapis)));

.slot{border-radius:12px;border-width:1.5px;transition:transform .12s,border-color .15s}
.slot:not([disabled]):not(.taken):not(.mine):hover{border-color:var(--accent)}
.slot[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);box-shadow:0 6px 16px var(--glow);animation:pop .25s}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.06)}100%{transform:scale(1)}}

.tag{padding:4px 12px}
.gallery{gap:8px}
.gallery img,.me-list img{border-radius:16px;transition:transform .2s}

.me-photo img{border:3px solid var(--gold)}

main#app>*{animation:rise .5s both}
main#app>*:nth-child(2){animation-delay:.05s}main#app>*:nth-child(3){animation-delay:.1s}
main#app>*:nth-child(4){animation-delay:.15s}main#app>*:nth-child(5){animation-delay:.2s}

</style>

async function rpc(fn,args){

    headers:{"apikey":SB_KEY,"Content-Type":"application/json"},body:JSON.stringify(args||{})});

function editPhoto(file,cb){const img=new Image();img.onload=()=>{
  const S=600,ov=document.createElement("div");ov.className="cropper";
  ov.innerHTML='<b>حرّك الصورة بإصبعك، وكبّرها من الشريط</b><canvas width="600" height="600"></canvas><input type="range" min="1" max="4" step="0.01" value="1" aria-label="تكبير الصورة"><div class="row"><button class="btn" style="width:auto;margin:0">احفظ الصورة</button><button class="alt">إلغاء</button></div>';
  document.body.appendChild(ov);
  const c=ov.querySelector("canvas"),x=c.getContext("2d"),z=ov.querySelector("input"),base=S/Math.min(img.width,img.height);
  let zoom=1,cx=img.width/2,cy=img.height/2,drag=null;
  const clamp=()=>{const half=S/(2*base*zoom);cx=Math.min(Math.max(cx,half),img.width-half);cy=Math.min(Math.max(cy,half),img.height-half)};
  const paint=()=>{clamp();const s=base*zoom;x.fillStyle="#000";x.fillRect(0,0,S,S);x.drawImage(img,S/2-cx*s,S/2-cy*s,img.width*s,img.height*s)};
  z.oninput=()=>{zoom=+z.value;paint()};
  c.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY};c.setPointerCapture(e.pointerId)};
  c.onpointermove=e=>{if(!drag)return;const k=S/c.getBoundingClientRect().width/(base*zoom);cx-=(e.clientX-drag.x)*k;cy-=(e.clientY-drag.y)*k;drag={x:e.clientX,y:e.clientY};paint()};
  c.onpointerup=c.onpointercancel=()=>{drag=null};
  const [ok,no]=ov.querySelectorAll(".row button");
  no.onclick=()=>ov.remove();
  ok.onclick=()=>{paint();const d=c.toDataURL("image/jpeg",0.8);ov.remove();cb(d)};
  paint()};img.onerror=()=>alert("ما انفتحت الصورة. جرب صورة ثانية.");img.src=URL.createObjectURL(file)}
function shrink(file,max){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{
  const s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement("canvas");
  c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);
  URL.revokeObjectURL(img.src);res(c.toDataURL("image/jpeg",0.75))};img.onerror=rej;img.src=URL.createObjectURL(file)})}
function pickFile(cb){const i=document.createElement("input");i.type="file";i.accept="image/*";i.onchange=()=>i.files[0]&&cb(i.files[0]);i.click()}

      if(readyKind()){const rb=document.createElement("button");rb.className="alt";rb.textContent=x.ready?readyLabel()+": "+readyText(x.ready):readyLabel();
        rb.onclick=()=>readyEditor(li,x);row.appendChild(rb);

          n.href=wa(x.phone)+"?text="+encodeURIComponent("أهلًا "+x.name+"، "+readyLabel()+" مالتك "+readyText(x.ready)+". تكدر تتابع من هذا الرابط: "+cLink);row.appendChild(n)}}
      if(x.status==="done")row.insertAdjacentHTML("beforeend",'<span class="tag ok">خلص</span>');
      else{

        row.append(d,c)}
      li.appendChild(row);ul.appendChild(li)});
    if(readyKind()==="date"){let pk=[];try{pk=(await rpc("owner_pickups",{p_shop:shopId,p_pin:pin,p_day:day}))||[]}catch(e){}

    '<li>يضيف صوره وصور شغله ويغلق أيام العطل</li>'+
    '<li>يرتب شغله أكثر، ويربح زبائن أكثر</li></ul></div>'+
    '<button class="btn adm-big" id="adm">دخول المدير</button>'+
    contact("للاشتراك والاستفسار");

}

document.body.dataset.role=q.get("shop")?"customer":q.get("barber")?"owner":q.has("admin")?"admin":"home";
if(q.get("shop"))customer(q.get("shop"));
else if(q.get("barber"))owner(q.get("barber"));
