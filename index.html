function femApply(root,list){const ar="\u0600-\u06FF";
  const rx=list.map(([a,b])=>[new RegExp("(^|[^"+ar+"])"+a.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"(?=$|[^"+ar+"])","g"),b]);
  const fix=n=>{let t=n.nodeValue,o=t;rx.forEach(([r,b])=>{t=t.replace(r,(m,p)=>p+b)});if(t!==o)n.nodeValue=t};
  const walk=el=>{const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode())fix(n)};
  walk(root);new MutationObserver(ms=>ms.forEach(m=>{m.addedNodes.forEach(n=>{if(n.nodeType===3)fix(n);else if(n.nodeType===1)walk(n)});if(m.type==="characterData")fix(m.target)})).observe(root,{childList:true,subtree:true,characterData:true})}

function editPhoto(file,cb){const img=new Image();img.onload=()=>{
  const S=600,ov=document.createElement("div");ov.className="cropper";
  ov.innerHTML='<b>حرّك الصورة بإصبعك، وكبّرها من الشريط</b><canvas width="600" height="600"></canvas><input type="range" min="1" max="4" step="0.01" value="1" aria-label="تكبير الصورة"><div class="row"><button class="btn" style="width:auto;margin:0">احفظ الصورة</button><button class="alt">إلغاء</button></div>';
  document.body.appendChild(ov);
  const c=ov.querySelector("canvas"),x=c.getContext("2d"),z=ov.querySelector("input"),base=S/Math.min(img.width,img.height);
  let zoom=1,cx=img.width/2,cy=img.height/2,drag=null;
  const clamp=()=>{const half=S/(2*base*zoom);cx=Math.min(Math.max(cx,half),img.width-half);cy=Math.min(Math.max(cy,half),img.height-half)};
  const paint=()=>{clamp();const s=base*zoom;x.fillStyle="#000";x.fillRect(0,0,S,S);x.drawImage(img,S/2-cx*s,S/2-cy*s,img.width*s,img.height*s)};
  z.oninput=()=>{zoom=+z.value;paint()};
  c.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY};c.setPointerCapture(e.pointerId)};
  c.onpointermove=e=>{if(!drag)return;const k=S/c.getBoundingClientRect().width/(base*zoom);cx-=(e.clientX-drag.x)*k;cy-=(e.clientY-drag.y)*k;drag={x:e.clientX,y:e.clientY};paint()};
  c.onpointerup=c.onpointercancel=()=>{drag=null};
  const [ok,no]=ov.querySelectorAll(".row button");
  no.onclick=()=>ov.remove();
  ok.onclick=()=>{paint();const d=c.toDataURL("image/jpeg",0.8);ov.remove();cb(d)};
  paint()};img.onerror=()=>alert("ما انفتحت الصورة. جرب صورة ثانية.");img.src=URL.createObjectURL(file)}
function shrink(file,max){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{
  const s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement("canvas");
  c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);
  URL.revokeObjectURL(img.src);res(c.toDataURL("image/jpeg",0.75))};img.onerror=rej;img.src=URL.createObjectURL(file)})}

    $("svcSave").onclick=async()=>{try{await rpc("owner_set_services",{p_shop:shopId,p_pin:pin,p_text:$("svcT").value.slice(0,1500)});alert("انحفظت الخدمات.")}catch(e){alert("ما انحفظ. تأكد إنك شغّلت آخر كود بـ Supabase.")}};
  }
  async function draw(){
    try{closed=(await rpc("closed_list",{p_shop:shopId}))||[]}catch(e){}
    try{SCHED=await rpc("shop_sched",{p_shop:shopId})}catch(e){}
    daysBar($("days"),day,closed.concat(offList()),d=>{day=d;draw()});
    const isClosed=closed.includes(day);
    drawHrs();
    $("dayCtl").innerHTML=(isClosed?note("bad","هذا اليوم مغلق، و"+w.peopleAll+" ما يكدرون يحجزون بيه."):"")+
      '<button class="alt '+(isClosed?"":"danger")+'" id="tog">'+(isClosed?"افتح هذا اليوم":"أغلق هذا اليوم")+'</button>';
    $("tog").onclick=async()=>{
      if(!isClosed&&!confirm("تغلق يوم "+fmt(day)+"؟ "+w.peopleAll+" ما راح يكدرون يحجزون بيه."))return;
      await rpc("owner_toggle_day",{p_shop:shopId,p_pin:pin,p_day:day}).catch(()=>{});draw()};
    $("walkBtn").hidden=isClosed||isOff(day);$("walk").innerHTML="";drawWait();
    $("walkBtn").onclick=()=>walkIn();
    const ul=$("list");ul.innerHTML='<li class="empty">جاري التحميل…</li>';
    let rows=[];try{rows=(await rpc("barber_bookings",{p_shop:shopId,p_pin:pin,p_day:day}))||[]}catch(e){ul.innerHTML='<li class="empty">خلل بالاتصال. حدّث الصفحة.</li>';return}
    rows=rows.filter(x=>x.status!=="cancel");
    $("cnt").textContent=rows.length+" موعد، خلص منهم "+rows.filter(x=>x.status==="done").length;
    ul.innerHTML=rows.length?"":'<li class="empty">ماكو مواعيد بهذا اليوم بعد.</li>';
    rows.forEach(x=>{const li=document.createElement("li");
      li.innerHTML='<span class="time">'+esc(t12(x.time))+'</span><span class="who">'+esc(x.name)+(x.age?' · العمر '+esc(x.age):'')+(x.complaint?'<small>'+esc(x.complaint)+'</small>':'')+(x.phone&&x.phone!=="-"?'<small><a class="ltr" href="tel:'+esc(x.phone)+'">'+esc(x.phone)+'</a></small>':'<small>حجز من يم '+(HEADW[KIND]||"المحل")+'</small>')+'</span>';
      const row=document.createElement("span");row.className="row";row.style.marginTop="0";
      if(isClosed){const n=document.createElement("a");n.className="alt";n.textContent="بلّغه بالواتساب";n.target="_blank";n.rel="noopener";
        n.href=wa(x.phone)+"?text="+encodeURIComponent("أهلًا "+x.name+"، نعتذر منك، "+w.place+" مغلق يوم "+fmt(day)+" وموعدك كان الساعة "+t12(x.time)+". تكدر تحجز موعد جديد من هذا الرابط: "+cLink);
        row.appendChild(n)}
      if(readyKind()){const rb=document.createElement("button");rb.className="alt";rb.textContent=x.ready?readyLabel()+": "+readyText(x.ready):readyLabel();
        rb.onclick=()=>readyEditor(li,x);row.appendChild(rb);
        if(x.ready){const n=document.createElement("a");n.className="alt";n.textContent="دز للزبون بالواتساب";n.target="_blank";n.rel="noopener";
          n.href=wa(x.phone)+"?text="+encodeURIComponent("أهلًا "+x.name+"، "+readyLabel()+" مالتك "+readyText(x.ready)+". تكدر تتابع من هذا الرابط: "+cLink);row.appendChild(n)}}
      if(x.status!=="done"&&x.phone&&x.phone!=="-"&&!isClosed){const n=document.createElement("a");n.className="alt";n.textContent="ذكّره بالواتساب";n.target="_blank";n.rel="noopener";
        n.href=wa(x.phone)+"?text="+encodeURIComponent("أهلًا "+x.name+"، نذكرك بموعدك عند "+shop.name+" يوم "+fmt(day)+" الساعة "+t12(x.time)+". إذا ما تگدر تجي، تگدر تلغيه أو تغيّره من هذا الرابط: "+cLink);row.appendChild(n)}
      if(x.status==="done")row.insertAdjacentHTML("beforeend",'<span class="tag ok">خلص</span>');
      else{
        const d=document.createElement("button");d.className="alt";d.textContent="خلص";
        d.onclick=async()=>{await rpc("barber_set_status",{p_shop:shopId,p_pin:pin,p_id:x.id,p_status:"done"}).catch(()=>{});draw()};
        const c=document.createElement("button");c.className="alt";c.textContent="ألغِ";
        c.onclick=async()=>{if(!confirm("تلغي موعد "+x.name+"؟"))return;await rpc("barber_set_status",{p_shop:shopId,p_pin:pin,p_id:x.id,p_status:"cancel"}).catch(()=>{});draw()};
        row.append(d,c)}
      li.appendChild(row);ul.appendChild(li)});
    if(readyKind()==="date"){let pk=[];try{pk=(await rpc("owner_pickups",{p_shop:shopId,p_pin:pin,p_day:day}))||[]}catch(e){}
      if(pk.length){if(!rows.length)ul.innerHTML="";const hd=document.createElement("li");hd.className="empty";hd.textContent="استلامات هذا اليوم: "+pk.length;ul.appendChild(hd);
        pk.forEach(x=>{const li=document.createElement("li");const t=(x.ready||"").split(" ")[1];
          li.innerHTML='<span class="time">'+(t?esc(hm12(t)):"استلام")+'</span><span class="who">'+esc(x.name)+(x.age?' · العمر '+esc(x.age):'')+(x.complaint?'<small>'+esc(x.complaint)+'</small>':'')+'<small>حجز يوم '+esc(fmt(x.day))+' · <a class="ltr" href="tel:'+esc(x.phone)+'">'+esc(x.phone)+'</a></small></span><span class="tag ok">استلام</span>';
          ul.appendChild(li)})}}
  }
  {const cp=$("cpy");if(cp){const rw=cp.closest(".row"),hn=rw.previousElementSibling,hd=hn&&hn.previousElementSibling;
    [hd,hn,rw].forEach(x=>{if(x)app.appendChild(x)})}}
  if(KIND==="salon"){femApply(app,FEM_OWNER);femApply(document.querySelector("header"),FEM_OWNER)}
  draw().then(offsUI);loadG();stats();newCheck();setInterval(newCheck,60000);
}

/* ================= المدير ================= */
async function admin(){
  setHead("لوحة المدير","إدارة المحلات للحلاقين والأسواق والدكاترة والمواعيد");
  const saved=read("admin-pin");
  if(saved&&await rpc("admin_login",{p_pin:saved}).catch(()=>false))return adminHome(saved);
  app.innerHTML='<h2>ادخل رمز المدير</h2><input id="pin" inputmode="numeric" type="password" dir="ltr"><button class="btn" id="in">ادخل</button><div id="msg"></div>';
  $("in").onclick=async()=>{
    const pin=$("pin").value.trim();
    let ok=false;try{ok=await rpc("admin_login",{p_pin:pin})}catch(e){}
    if(!ok){$("msg").innerHTML=note("bad","الرمز غلط.");return}
    store("admin-pin",pin);adminHome(pin);
  };
}
function adminHome(pin){
  const base=location.origin+location.pathname;
  app.innerHTML='<h2>إضافة مدير ثانوي جديد</h2>'+
    '<label for="an">اسم المحل</label><input id="an" placeholder="اسم صاحب المحل أو اسم المحل">'+
    '<label for="at">نوع المحل</label><select id="at">'+Object.keys(TYPES).map(k=>'<option value="'+k+'">'+TYPES[k]+'</option>').join("")+'</select>'+
    '<label for="ap">رقم صاحب المحل</label><input id="ap" inputmode="tel" dir="ltr" placeholder="07xxxxxxxxx">'+
    '<label for="ak">الرقم السري لصاحب المحل</label><input id="ak" inputmode="numeric" dir="ltr" placeholder="مثلًا: 4821">'+
    '<label for="am">مدة الاشتراك</label><select id="am">'+subOpts(30)+'</select>'+
    '<button class="btn" id="add">أضف مدير ثانوي</button><div id="msg"></div>'+
    '<h2>المحلات المشتركة</h2><ul class="list" id="list"></ul>'+
    '<button class="alt" id="out" style="margin-top:16px">اطلع من الحساب</button>'+
    '<div class="contact">صاحب إدارة البرنامج: '+esc(OWNER_NAME)+'<br><span class="ltr">'+OWNER_PHONE+'</span></div>';
  $("out").onclick=()=>{store("admin-pin");location.reload()};
  let allShops=[];
  $("add").onclick=async()=>{
    const n=$("an").value.trim(),p=$("ap").value.trim(),k=$("ak").value.trim(),m=+$("am").value,t=$("at").value;
    const msg=$("msg");
    const ae=nameErr(n)||phoneErr(p)||pinErr(k)||(allShops.some(x=>x.barber_pin===k)?"هذا الرقم السري مستخدم لمدير ثانوي ثاني، اختار رقم غيره.":"");
    if(ae){msg.innerHTML=note("bad",ae);return}
    try{await rpc("admin_add_shop3",{p_pin:pin,p_name:n,p_phone:p,p_barber_pin:k,p_days:m,p_kind:t});
      msg.innerHTML=note("good","انضاف المحل. دز الرابط والرقم السري لصاحب المحل.");
      ["an","ap","ak"].forEach(id=>$(id).value="");draw();
    }catch(e){msg.innerHTML=note("bad","ما انضاف. السبب: "+String(e.message||e).slice(0,200))}
  };
  async function draw(){
    const ul=$("list");ul.innerHTML='<li class="empty">جاري التحميل…</li>';
    let shops=[];try{shops=allShops=(await rpc("admin_shops2",{p_pin:pin}))||[]}catch(e){ul.innerHTML='<li class="empty">خلل بالاتصال.</li>';return}
    ul.innerHTML=shops.length?"":'<li class="empty">ماكو محلات بعد. أضف أول محل من فوق.</li>';
    {let eb=document.getElementById("expBox");if(!eb){eb=document.createElement("div");eb.id="expBox";ul.parentNode.insertBefore(eb,ul)}
     const dl=x=>Math.round((new Date(x.expires+"T00:00:00")-new Date(today()+"T00:00:00"))/864e5)+1;
     const near=shops.filter(x=>dl(x)<=3).sort((a,b)=>dl(a)-dl(b));
     eb.innerHTML=near.length?'<div class="exp-box"><b>اشتراكات قربت تخلص ('+near.length+')</b>'+near.map(x=>{const n=dl(x);
       const t=n<=0?"خلص اشتراكك":(n===1?"آخر يوم اليوم":"باقي "+n+" أيام");
       const m="أهلًا "+x.name+"، "+(n<=0?"انتهى اشتراك صفحتك بنظام الحجز":"اشتراك صفحتك بنظام الحجز "+(n===1?"ينتهي اليوم":"باقي عليه "+n+" أيام"))+". حتى تجدده تواصل ويايه. "+OWNER_NAME+" "+OWNER_PHONE;
       return '<div class="exp-row"><span>'+esc(x.name)+' · <span class="tag '+(n<=0?"bad":"warn")+'">'+t+'</span></span>'+
         (x.phone?'<a class="alt" target="_blank" rel="noopener" href="'+wa(x.phone)+'?text='+encodeURIComponent(m)+'">ذكّره بالواتساب</a>':'')+'</div>'}).join("")+'</div>':""}
    shops.forEach(s=>{
      const active=s.expires>=today();
      const cLink=base+"?shop="+s.id,oLink=base+"?barber="+s.id,w=W(s.kind);
      const li=document.createElement("li");
      li.innerHTML='<span class="who"><b>'+esc(s.name)+'</b><small class="ltr">'+esc(s.phone||"")+'</small>'+
        '<small>النوع: '+esc(TYPES[s.kind]||"حلاق")+'</small>'+
        '<small>الرقم السري: <span class="ltr">'+esc(s.barber_pin)+'</span></small>'+
        (()=>{const f=SUBS.find(y=>y[0]===s.sub_days),n=Math.round((new Date(s.expires+"T00:00:00")-new Date(today()+"T00:00:00"))/864e5)+1;
          return '<small>الاشتراك: '+(f?f[1]:(s.sub_days?s.sub_days+" يوم":"—"))+' · '+(n>0?(n===1?"باقي يوم واحد":"باقي "+n+" يوم"):"منتهي")+'</small>'})()+'</span>'+
        '<span class="tag '+(active?"ok":"bad")+'">'+(active?"لغاية "+s.expires.split("-").reverse().join("/"):"منتهي")+'</span>';
      const row=document.createElement("div");row.className="row";row.style.width="100%";
      const mk=(t,f)=>{const b=document.createElement("button");b.className="alt";b.textContent=t;b.onclick=f;row.appendChild(b)};
      mk("نسخ "+w.link,()=>copy(cLink));
      mk("نسخ رابط "+(OWNERW[s.kind||"barber"]||"صاحب المحل"),()=>copy(oLink));
      mk("دز بالواتساب",()=>{const t="أهلًا، هاي روابط نظام الحجز مال "+s.name+":\n"+w.link+" (حطه بالانستغرام أو دزه ل"+w.people+"): "+cLink+"\nرابط صفحتك: "+oLink+"\nرقمك السري: "+s.barber_pin+
        "\nللاستفسار وتجديد الاشتراك: "+OWNER_NAME+" "+OWNER_PHONE;
        window.open(wa(s.phone)+"?text="+encodeURIComponent(t),"_blank")});
      const ed=document.createElement("div");ed.style.width="100%";ed.hidden=true;
      ed.innerHTML='<label>الاسم</label><input class="eN">'+
        '<label>رقم التلفون</label><input class="eP" inputmode="tel" dir="ltr">'+
        '<label>الرقم السري</label><input class="eK" inputmode="numeric" dir="ltr">'+
        '<label>النوع</label><select class="eT"></select>'+
        '<label>الاشتراك من اليوم (حالياً '+(active?"لغاية "+s.expires.split("-").reverse().join("/"):"منتهي")+')</label><select class="eD"><option value="0">بدون تغيير</option>'+subOpts(-1)+'</select>'+
        '<div class="row"><button class="alt eS">احفظ التعديل</button><button class="alt eC">رجوع</button></div>';
      ed.querySelector(".eN").value=s.name;ed.querySelector(".eP").value=s.phone||"";ed.querySelector(".eK").value=s.barber_pin;
      const eT=ed.querySelector(".eT");
      Object.keys(TYPES).forEach(k=>{const o=document.createElement("option");o.value=k;o.textContent=TYPES[k];if((s.kind||"barber")===k)o.selected=true;eT.appendChild(o)});
      ed.querySelector(".eC").onclick=()=>{ed.hidden=true};
      ed.querySelector(".eS").onclick=async()=>{
        const n=ed.querySelector(".eN").value.trim(),p=ed.querySelector(".eP").value.trim(),k=ed.querySelector(".eK").value.trim();
        const kd=eT.value,dd=+ed.querySelector(".eD").value;
        const ee=nameErr(n)||phoneErr(p)||pinErr(k)||(allShops.some(x=>x.id!==s.id&&x.barber_pin===k)?"هذا الرقم السري مستخدم لمدير ثانوي ثاني، اختار رقم غيره.":"");
        if(ee){alert(ee);return}
        const btn=ed.querySelector(".eS");btn.disabled=true;btn.textContent="جاري الحفظ…";
        const bad=[];
        try{await rpc("admin_edit_shop",{p_pin:pin,p_shop:s.id,p_name:n,p_phone:p,p_barber_pin:k})}catch(e){bad.push("الاسم والتلفون والرقم السري")}
        if(kd!==(s.kind||"barber")){try{await rpc("admin_set_kind",{p_pin:pin,p_shop:s.id,p_kind:kd})}catch(e){bad.push("النوع")}}
        if(dd>0){try{await rpc("admin_set_sub",{p_pin:pin,p_shop:s.id,p_days:dd})}catch(e){bad.push("الاشتراك")}}
        if(bad.length)alert("ما انحفظ: "+bad.join("، ")+". تأكد إنك شغّلت آخر كود بـ Supabase.");
        else alert("انحفظ التعديل.");
        draw()};
      const row2=document.createElement("div");row2.className="row";row2.style.width="100%";
      const e=document.createElement("button");e.className="alt";e.textContent="تعديل";e.onclick=()=>{ed.hidden=!ed.hidden};
      const d=document.createElement("button");d.className="alt danger";d.textContent="حذف";
      d.onclick=async()=>{if(!confirm("تحذف "+s.name+" نهائياً؟ راح تنمسح كل مواعيده وصوره، وروابطه ما تشتغل بعد."))return;
        try{await rpc("admin_delete_shop",{p_pin:pin,p_shop:s.id});draw()}
        catch(e){alert("ما انحذف. تأكد إنك شغّلت آخر كود بـ Supabase.")}};
      row2.append(e,d);
      li.append(row,row2,ed);ul.appendChild(li)});
  }
  draw();
}
